<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤怠 点検</title>
<style>
  body{margin:0;background:#f3f5f9;color:#1b2942;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;}
  header{background:#122e60;color:#fff;padding:14px 16px;font-size:18px;font-weight:800;}
  main{padding:14px 16px 40px;max-width:560px;margin:0 auto;}
  .row{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.5;}
  .row b{display:block;font-size:13px;color:#6b7386;margin-bottom:2px;}
  .ok{color:#13834a;font-weight:700;} .ng{color:#c0392b;font-weight:700;} .wait{color:#6b7386;}
  .small{font-size:12px;color:#6b7386;word-break:break-all;}
  button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;margin-top:12px;text-align:center;text-decoration:none;font-family:inherit;}
  .b1{background:#c0392b;color:#fff;} .b2{background:#122e60;color:#fff;}
  .note{font-size:13px;color:#6b7386;margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<header>勤怠管理の点検</header>
<main>
  <div class="row"><b>1. このスマホの画面の動き</b><span id="r1" class="wait">確認中…</span></div>
  <div class="row"><b>2. スマホ内の控えデータ</b><span id="r2" class="wait">確認中…</span></div>
  <div class="row"><b>3. Googleとの通信</b><span id="r3" class="wait">確認中…</span></div>
  <div class="row"><b>4. 自分の今日の打刻</b><span id="r4" class="wait">確認中…</span></div>
  <div class="row"><b>機種の情報</b><span id="ua" class="small"></span></div>

  <button class="b1" id="clear" type="button">控えデータを消してやり直す</button>
  <a class="btn b2" id="open" href="kintai_app.html">勤怠管理を開く</a>
  <p class="note">この画面を、そのままスクリーンショットして中野に送ってください。</p>
</main>
<script>
(function(){
  var API_URL = 'https://script.google.com/macros/s/AKfycbwfy78QKZg9WQZsa_EvxOLM5Xvc3QcVG3GaWUlz1Vuhts3t1AOzUfe8y-14hH4n0LnIow/exec';
  function $(id){ return document.getElementById(id); }
  function put(id, cls, text){ var e=$(id); e.className=cls; e.textContent=text; }

  var me = '';
  try{ me = new URLSearchParams(location.search).get('me') || ''; }catch(e){}
  if(me) $('open').href = 'kintai_app.html?me=' + encodeURIComponent(me);
  $('ua').textContent = navigator.userAgent;

  // 1. 画面の動き
  var lacks = [];
  if(!window.fetch) lacks.push('fetch');
  if(!window.Promise) lacks.push('Promise');
  if(!window.URLSearchParams) lacks.push('URLSearchParams');
  if(!window.JSON) lacks.push('JSON');
  if(lacks.length) put('r1','ng','× 古いため動かない部分があります（'+lacks.join('、')+'）');
  else put('r1','ok','○ 問題なし');

  // 2. 控えデータ
  function kintaiKeys(){
    var ks=[];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf('kintai')===0) ks.push(k); }
    return ks;
  }
  function showStore(){
    try{
      localStorage.setItem('kintai_check_t','1'); localStorage.removeItem('kintai_check_t');
      var ks = kintaiKeys();
      var name = localStorage.getItem('kintai_my_name') || '';
      put('r2','ok','○ 保存できます（控え '+ks.length+'件'+(name?'、登録名：'+name:'')+'）');
    }catch(e){
      put('r2','ng','× スマホに保存できません（プライベートモードの可能性）');
    }
  }
  showStore();

  $('clear').onclick = function(){
    try{
      var ks = kintaiKeys();
      for(var i=0;i<ks.length;i++) localStorage.removeItem(ks[i]);
      alert('控えデータを '+ks.length+' 件消しました。「勤怠管理を開く」を押してください。');
    }catch(e){ alert('消せませんでした：'+(e.message||e)); }
    showStore();
  };

  // 3・4. 通信
  function api(fn, args){
    var t0 = Date.now();
    return fetch(API_URL, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({fn:fn, args:args})
    }).then(function(r){
      if(!r.ok) throw new Error('通信エラー '+r.status);
      return r.json();
    }).then(function(j){
      if(!j.ok) throw new Error(j.error || '処理エラー');
      return { result:j.result, sec:((Date.now()-t0)/1000).toFixed(1) };
    });
  }
  if(!window.fetch){ put('r3','ng','× 通信の機能がありません'); put('r4','ng','× 確認できません'); return; }

  var timer = setTimeout(function(){ put('r3','ng','× 30秒たっても返事がありません'); }, 30000);
  api('getInitialData', []).then(function(x){
    clearTimeout(timer);
    var staff = (x.result && x.result.staff) || [];
    put('r3','ok','○ つながりました（'+x.sec+'秒、日付 '+(x.result && x.result.today)+'）');
    if(!me){ put('r4','wait','（名前つきの入口から開くと確認します）'); return; }
    if(staff.indexOf(me) < 0){ put('r4','ng','× 名簿に「'+me+'」が見つかりません'); return; }
    return api('getActiveRecord', [me]).then(function(y){
      var r = y.result;
      if(!r) put('r4','ok','○ '+me+'：いまは勤務中の記録なし（'+y.sec+'秒）');
      else put('r4','ok','○ '+me+'：出勤 '+(r.clockIn||'-')+' / 退勤 '+(r.clockOut||'-')+'（'+y.sec+'秒）');
    });
  }).catch(function(e){
    clearTimeout(timer);
    put('r3','ng','× つながりません：'+(e && e.message || e));
    put('r4','ng','× 確認できません');
  });
})();
</script>
</body>
</html>
